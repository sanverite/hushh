name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests and Android APK
        run: ./gradlew :shared:allTests :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hushh-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Build the iOS app for the simulator
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp
          -configuration Debug -sdk iphonesimulator -arch arm64
          CODE_SIGNING_ALLOWED=NO build
